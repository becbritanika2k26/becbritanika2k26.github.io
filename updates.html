<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Updates | BEC Britanika 2K26</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .update-card {
            border-left: 4px solid var(--primary);
            margin-bottom: 2rem;
        }
        .update-time {
            color: var(--primary);
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
        }
        .badge {
            background: rgba(0, 242, 254, 0.1);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            text-transform: uppercase;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <img src="assets/logo.png" alt="BEC Logo" class="nav-logo-img">
            <div class="logo-text">
                BRITANIKA 2K26
                <span>BHUBANESWAR ENGINEERING COLLEGE</span>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="sports.html">Sports</a></li>
            <li><a href="cultural.html">Cultural</a></li>
            <li><a href="events.html">Other Events</a></li>
            <li><a href="schedule.html">Schedule</a></li>
            <li><a href="updates.html">Live Updates</a></li>
        </ul>
        <div class="mobile-menu-btn"><i class="fas fa-bars"></i></div>
    </nav>

    <div class="container" style="margin-top: 80px;">
        <div class="section-title">Live Updates & Announcements</div>
        <div id="updates-container" style="max-width: 800px; margin: 0 auto;">
            <!-- Dynamic Content -->
        </div>
    </div>

    <script src="js/fetchData.js"></script>
    <script src="js/main.js"></script>
    <script>
        async function loadUpdates() {
            const updates = await DataManager.getUpdates();
            const container = document.getElementById('updates-container');
            
            container.innerHTML = updates.map(u => `
                <div class="card update-card">
                    <div class="update-time">
                        <i class="far fa-clock"></i> ${u.time}
                        <span class="badge">${u.type}</span>
                    </div>
                    ${u.image ? `<img src="${u.image}" alt="${u.title}" style="width: 100%; border-radius: 15px; margin-bottom: 1.5rem; border: 1px solid var(--glass-border);">` : ''}
                    <h3>${u.title}</h3>
                    <p style="color: var(--text-dim);">${u.content}</p>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', loadUpdates);
    </script>
</body>
</html>
