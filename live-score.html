<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE BROADCAST | BEC Britanika 2K26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/broadcast.css?v=3.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        .nav-hub { position: fixed; top: 15px; left: 15px; z-index: 1000; }
        .nav-link { background: rgba(15, 23, 42, 0.8); padding: 8px 16px; border-radius: 50px; color: white; text-decoration: none; font-size: 0.8rem; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); font-weight: 900; }
        
        /* LOWER THIRD TV GRAPHIC */
        .tv-lower-third {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 1000px;
            background: linear-gradient(180deg, #050810 0%, #1e293b 100%);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            padding: 8px 15px;
            z-index: 500;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            animation: slideUpInfo 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (max-width: 600px) {
            .tv-lower-third {
                grid-template-columns: 1fr 0.5fr 1fr;
                padding: 6px 10px;
                bottom: 15px;
            }
            .p-label { display: none; }
            .player-name { font-size: 0.8rem; }
            .player-score { font-size: 0.8rem; }
            .tv-lower-third i { display: none; }
        }

        @keyframes slideUpInfo { 
            from { transform: translate(-50%, 150%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .player-info-mini { display: flex; align-items: center; gap: 15px; }
        .player-name { font-weight: 900; color: #fff; font-size: 1.1rem; }
        .player-score { color: var(--accent-blue); font-weight: 900; font-size: 1.1rem; }
        
        .partnership-bar {
            background: rgba(255,255,255,0.05);
            border-left: 1px solid rgba(255,255,255,0.1);
            border-right: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .p-val { font-size: 1.2rem; font-weight: 900; color: #fff; }
        .p-label { font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; }

        /* Animation Overlays */
        .event-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2000; display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); pointer-events: none;
        }
        .event-content { text-align: center; }
        .event-text { font-size: clamp(5rem, 15vw, 10rem); font-weight: 900; text-transform: uppercase; line-height: 0.8; }
        .event-subtext { font-size: 1.5rem; letter-spacing: 10px; margin-top: 20px; font-weight: 800; }

        @keyframes flare {
            0% { filter: brightness(1); }
            50% { filter: brightness(2) contrast(1.2); }
            100% { filter: brightness(1); }
        }

        .animating .big-score { animation: flare 0.5s ease; }
    </style>
</head>
<body class="broadcast-theme">

    <div class="nav-hub"><a href="index.html" class="nav-link">🏠 EXIT HUB</a></div>

    <div id="event-animation-overlay" class="event-overlay">
        <div class="event-content">
            <div class="event-text" id="event-main-text">SIX!</div>
            <div class="event-subtext" id="event-sub-text">OUT OF THE PARK!</div>
        </div>
    </div>

    <div class="broadcast-container">
        <!-- Main Header Scoreboard -->
        <div class="glass-panel scoreboard-main">
            <div class="team-info">
                <div class="team-details">
                    <h2 id="team-a-name">TEAM A</h2>
                    <span class="status-badge status-live">BROADCASTING</span>
                </div>
            </div>
            
            <div class="center-score">
                <div id="main-score-display" class="big-score">0/0</div>
                <div id="current-overs" class="overs-display">0.0 OVERS</div>
            </div>

            <div class="team-info" style="justify-content: flex-end; text-align: right;">
                <div class="team-details">
                    <h2 id="team-b-name">TEAM B</h2>
                    <div id="target-info" style="font-size: 1rem; color: var(--accent-gold); font-weight: 900;"></div>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <!-- Batting Card -->
            <div class="stat-box">
                <span class="stat-label"><i class="fas fa-cricket-bat-ball"></i> BATTING</span>
                <div style="display: flex; flex-direction: column; gap: 15px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px;">
                        <div>
                            <div id="striker-name" class="player-name">Striker*</div>
                            <div style="font-size: 0.75rem; color: var(--text-dim);">ON STRIKE</div>
                        </div>
                        <div id="striker-runs" class="player-score">0 (0)</div>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; opacity: 0.7;">
                        <span id="non-striker-name" class="player-name">Non-Striker</span>
                        <span id="non-striker-runs" class="player-score">0 (0)</span>
                    </div>
                </div>
            </div>

            <!-- Over Tracking -->
            <div class="stat-box" style="text-align: center;">
                <span class="stat-label" style="justify-content: center;"><i class="fas fa-clock"></i> RECENT BALLS</span>
                <div class="recent-balls-tray" id="recent-balls-container"></div>
                <div id="rr-info" style="margin-top: 25px; font-size: 1.5rem; font-weight: 950; color: var(--accent-blue); letter-spacing: 1px;">CRR: 0.00</div>
            </div>

            <!-- Bowling Card -->
            <div class="stat-box">
                <span class="stat-label"><i class="fas fa-baseball-ball"></i> BOWLING</span>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <div id="bowler-name" class="player-name">BOWLER</div>
                        <div id="bowler-stats" style="color: var(--accent-blue); font-weight: 900; margin-top: 5px;">0-0 (0.0)</div>
                    </div>
                    <div id="bowler-econ-p" style="background: rgba(0,210,255,0.1); padding: 8px 15px; border-radius: 10px; color: var(--accent-blue); font-weight: 900; font-size: 0.9rem;">6.00</div>
                </div>
                <div class="stat-label" style="margin-top: 20px;">LAST WICKETS</div>
                <div id="scorecard-mini" class="scorecard-mini"></div>
            </div>
        </div>
    </div>

    <!-- PREVIOUS MATCHES SIDEBAR -->
    <div class="winner-sidebar">
        <div class="sidebar-title">
            <i class="fas fa-history"></i> PREVIOUS MATCHES
        </div>
        <div id="side-history-list"></div>
    </div>

    <!-- FULL SCREEN TV LOWER THIRD -->
    <div class="tv-lower-third">
        <div class="player-info-mini">
            <i class="fas fa-user-circle" style="font-size: 2rem; opacity: 0.3;"></i>
            <div>
                <div id="lt-striker-name" class="player-name">-</div>
                <div id="lt-striker-stat" class="player-score">0 (0)</div>
            </div>
        </div>
        <div class="partnership-bar">
            <div class="p-label">PARTNERSHIP</div>
            <div id="lt-partnership" class="p-val">0</div>
        </div>
        <div class="player-info-mini" style="justify-content: flex-end; text-align: right;">
            <div>
                <div id="lt-bowler-name" class="player-name">-</div>
                <div id="lt-bowler-stat" class="player-score">0-0 (0.0)</div>
            </div>
            <i class="fas fa-running" style="font-size: 2rem; opacity: 0.3;"></i>
        </div>
    </div>

    <!-- OVERLAYS -->
    <div id="big-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; text-align: center;">
        <h1 id="overlay-title" style="color: var(--accent-blue); font-size: clamp(3rem, 10vw, 5rem); font-weight: 950;">BREAK</h1>
        <h2 id="overlay-score" style="font-size: clamp(3rem, 8vw, 4rem); margin: 20px 0; color: #fff;">0/0</h2>
        <h3 id="overlay-sub" style="color: var(--accent-gold); font-size: 1.5rem; letter-spacing: 5px;">TARGET: 0</h3>
        
        <div id="win-anim-part" style="display: none; margin-top: 30px;">
            <i class="fas fa-trophy fa-bounce" style="font-size: 6rem; color: var(--accent-gold);"></i>
            <div id="winner-team-name" style="font-size: 3.5rem; color: var(--accent-gold); font-weight: 950; text-transform: uppercase;">WINNER</div>
            <div style="font-size: 1.5rem; color: #fff; letter-spacing: 15px;">CHAMPIONS</div>
        </div>
        
        <button onclick="document.getElementById('big-overlay').style.display='none'" style="margin-top: 50px; background: var(--accent-blue); border: none; color: #000; padding: 15px 40px; border-radius: 50px; cursor: pointer; font-weight: 900; letter-spacing: 2px;">RESUME BROADCAST</button>
    </div>

    <script type="module">
        import './js/cloudConfig.js';
        import './js/cricketEngine.js';
        import './js/adminController.js';
        import './js/historyRenderer.js';

        window.HistoryRenderer.init('side-history-list', 'cricket');
        window.AdminController.initConnectionIndicator();

        let lastEvent = null;

        window.CricketEngine.initSync((state) => {
            updateDisplay(state);
        });

        function triggerFX(type, sub) {
            const overlay = document.getElementById('event-animation-overlay');
            const main = document.getElementById('event-main-text');
            const subT = document.getElementById('event-sub-text');
            
            overlay.className = 'event-overlay theme-' + type.toLowerCase();
            main.innerText = type;
            subT.innerText = sub || '';
            
            overlay.style.display = 'flex';
            document.body.classList.add('animating');

            setTimeout(() => {
                overlay.style.opacity = '0';
                overlay.style.transition = '0.5s';
                setTimeout(() => {
                    overlay.style.display = 'none';
                    overlay.style.opacity = '1';
                    document.body.classList.remove('animating');
                }, 500);
            }, 2500);
        }

        function updateDisplay(state) {
            if(!state) return;
            const { teamA, teamB, currentInnings, target, status, lastEvent: curEvent, battingFirst } = state.matchInfo;
            const isTeamABattingFirst = String(battingFirst).toLowerCase() === String(teamA.name).toLowerCase();
            const curKey = isTeamABattingFirst ? (currentInnings === 1 ? 'teamA' : 'teamB') : (currentInnings === 1 ? 'teamB' : 'teamA');
            const curTeam = state.matchInfo[curKey];

            // FX Trigger
            if (curEvent && curEvent !== lastEvent) {
                const map = { 'FOUR': 'FOUR!', 'SIX': 'SIX!', 'WICKET': 'OUT!', 'WIN': 'WINNER!' };
                const sub = { 'FOUR': 'MAGNIFICENT BOUNDARY', 'SIX': 'CRACKING HIT!', 'WICKET': 'BIG BREAKTHROUGH' };
                if(map[curEvent]) triggerFX(map[curEvent], sub[curEvent] || 'UNBELIEVABLE!');
                lastEvent = curEvent;
            }

            // Header info
            document.getElementById('main-score-display').innerText = `${curTeam.score}/${curTeam.wickets}`;
            document.getElementById('current-overs').innerText = `${Math.floor(curTeam.balls/6)}.${curTeam.balls%6} OVERS`;
            document.getElementById('team-a-name').innerText = teamA.name;
            document.getElementById('team-b-name').innerText = teamB.name;

            // Stats
            document.getElementById('striker-name').innerText = state.batting.striker.name + "*";
            document.getElementById('striker-runs').innerText = `${state.batting.striker.runs} (${state.batting.striker.balls})`;
            document.getElementById('non-striker-name').innerText = state.batting.nonStriker.name;
            document.getElementById('non-striker-runs').innerText = `${state.batting.nonStriker.runs} (${state.batting.nonStriker.balls})`;

            // Lower Third
            document.getElementById('lt-striker-name').innerText = state.batting.striker.name;
            document.getElementById('lt-striker-stat').innerText = `${state.batting.striker.runs}(${state.batting.striker.balls})`;
            document.getElementById('lt-partnership').innerText = state.batting.striker.runs + state.batting.nonStriker.runs;
            document.getElementById('lt-bowler-name').innerText = state.bowling.currentBowler.name;
            document.getElementById('lt-bowler-stat').innerText = `${state.bowling.currentBowler.wickets}-${state.bowling.currentBowler.runs}`;

            // Bowler
            const b = state.bowling.currentBowler;
            document.getElementById('bowler-name').innerText = b.name;
            document.getElementById('bowler-stats').innerText = `${b.wickets}-${b.runs} (${Math.floor(b.balls/6)}.${b.balls%6})`;
            document.getElementById('bowler-econ-p').innerText = "ECON: " + (b.balls > 0 ? ((b.runs/b.balls)*6).toFixed(2) : "0.00");

            // Recent Balls Tray
            const tray = document.getElementById('recent-balls-container');
            tray.innerHTML = '';
            (state.recentBalls || []).slice(-6).forEach(v => {
                const dot = document.createElement('div');
                dot.className = 'ball-dot';
                if(v === 4) dot.classList.add('four');
                if(v === 6) dot.classList.add('six');
                if(v === 'W') dot.classList.add('wicket');
                dot.innerText = v;
                tray.appendChild(dot);
            });

            // Scorecard
            const sc = document.getElementById('scorecard-mini');
            sc.innerHTML = (curTeam.scorecard || []).slice(-3).map(p => `
                <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: 5px; opacity: 0.8; color: #fff;">
                    <span>${p.name}</span>
                    <span>${p.runs}(${p.balls})</span>
                </div>
            `).join('');

            // Overlays
            const bigO = document.getElementById('big-overlay');
            if(status === 'BREAK') {
                bigO.style.display = 'flex';
                document.getElementById('overlay-title').innerText = "INNINGS COMPLETED";
                document.getElementById('overlay-score').innerText = `${curTeam.score}/${curTeam.wickets}`;
                document.getElementById('overlay-sub').innerText = "TARGET: " + (curTeam.score + 1);
            } else if(status === 'COMPLETED') {
                bigO.style.display = 'flex';
                document.getElementById('win-anim-part').style.display = 'block';
                document.getElementById('overlay-title').innerText = "MATCH CONCLUDED";
                // Logic to find winner normally goes here
            } else {
                bigO.style.display = 'none';
            }

            // Target Info
            const targetEl = document.getElementById('target-info');
            const rrEl = document.getElementById('rr-info');
            if(target) {
                targetEl.innerHTML = `TARGET: ${target}<br><span style="color:#fff;font-size:0.8rem">NEED ${state.stats.runsNeeded} IN ${state.stats.ballsLeft} B</span>`;
                rrEl.innerText = `CRR: ${state.stats.crr} | RRR: ${state.stats.rrr}`;
            } else {
                targetEl.innerText = "1ST INNINGS";
                rrEl.innerText = `CRR: ${state.stats ? state.stats.crr : '0.00'}`;
            }
        }
    </script>
</body>
</html>
