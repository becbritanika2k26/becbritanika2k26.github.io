<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANAGE HISTORY | BRITANIKA 2K26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/broadcast.css">
    <style>
        body { background: #020617; font-family: 'Outfit', sans-serif; color: #fff; padding: 40px 20px; }
        .admin-container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--accent-blue); padding-bottom: 20px; }
        .history-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .manage-card { background: rgba(30, 41, 59, 0.6); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .match-info { flex: 1; }
        .btn-delete { background: #ef4444; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 900; transition: 0.2s; }
        .btn-delete:hover { background: #dc2626; transform: scale(1.05); }
        .sport-tag { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.6rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; }
        .tag-cricket { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
        .tag-volleyball { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .tag-kabaddi { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    </style>
</head>
<body class="admin-theme">
    <div id="auth-wall" style="position: fixed; top:0; left:0; width:100%; height:100%; background: #020617; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;">
        <h2 style="color: #ef4444;">ADMIN ACCESS ONLY</h2>
        <a href="admin.html" class="btn-main" style="text-decoration: none; padding: 12px 25px; background: var(--accent-blue); color: #000; border-radius: 8px;">GO TO LOGIN</a>
    </div>

    <div class="admin-container">
        <div class="header">
            <div>
                <h1 style="margin:0;">HISTORY <span style="color: var(--accent-blue);">MANAGER</span></h1>
                <p style="opacity: 0.6; font-size: 0.8rem;">Delete or manage match records centrally</p>
            </div>
            <a href="admin.html" class="btn-main" style="text-decoration: none; background: rgba(255,255,255,0.1); color: #fff; padding: 8px 20px; border-radius: 8px;">DASHBOARD</a>
        </div>

        <div class="history-grid" id="master-list">
            <p style="text-align: center; opacity: 0.5;">Loading master records...</p>
        </div>
    </div>

    <script type="module">
        import RealtimeSync from './js/realtimeSync.js';
        import { auth } from './js/cloudConfig.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-wall').style.display = 'none';
                loadAllHistory();
            }
        });

        async function loadAllHistory() {
            const list = document.getElementById('master-list');
            list.innerHTML = '';

            const collections = [
                { id: 'cricketHistory', label: 'Cricket', class: 'tag-cricket' },
                { id: 'volleyballHistory', label: 'Volleyball', class: 'tag-volleyball' },
                { id: 'kabaddiHistory', label: 'Kabaddi', class: 'tag-kabaddi' }
            ];

            collections.forEach(coll => {
                RealtimeSync.subscribeCollection(coll.id, (data) => {
                    data.forEach(m => {
                        const existing = document.getElementById(`item-${m.id}`);
                        if (existing) existing.remove();

                        const card = document.createElement('div');
                        card.id = `item-${m.id}`;
                        card.className = 'manage-card';
                        
                        // Extract teams based on structure
                        const teamA = m.teams ? m.teams.teamA.name : m.teamA;
                        const teamB = m.teams ? m.teams.teamB.name : m.teamB;
                        const date = new Date(m.timestamp).toLocaleString();

                        card.innerHTML = `
                            <div class="match-info">
                                <span class="sport-tag ${coll.class}">${coll.label}</span>
                                <div style="font-weight: 900; font-size: 1.1rem;">${teamA} VS ${teamB}</div>
                                <div style="font-size: 0.7rem; opacity: 0.5; margin-top: 5px;">${date}</div>
                            </div>
                            <button class="btn-delete" onclick="confirmDelete('${coll.id}', '${m.id}')">
                                <i class="fas fa-trash"></i> DELETE
                            </button>
                        `;
                        list.appendChild(card);
                    });
                });
            });
        }

        window.confirmDelete = async (coll, id) => {
            if (confirm('Bhai, ye record delete kardu? Ye hamesha ke liye chala jayega.')) {
                await RealtimeSync.deleteDocument(coll, id);
                document.getElementById(`item-${id}`)?.remove();
            }
        };
    </script>
</body>
</html>
