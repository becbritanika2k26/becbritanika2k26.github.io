<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Britanika 2K26</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-form {
            background: var(--bg-card);
            padding: 3rem;
            border-radius: 30px;
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid var(--glass-border);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <img src="assets/logo.png" alt="BEC Logo" class="nav-logo-img">
            <div class="logo-text">
                BRITANIKA ADMIN
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Back to Site</a></li>
        </ul>
    </nav>

    <div class="container" style="margin-top: 80px;">
        <div class="section-title">Add New Event / Update</div>
        
        <div class="admin-form">
            <div class="form-group">
                <label>Target Category</label>
                <select id="target-type">
                    <option value="sports">Sports</option>
                    <option value="cultural">Cultural</option>
                    <option value="other-events">Other Events</option>
                    <option value="updates">News / Live Update</option>
                    <option value="spotlight">Home Spotlight (Tomorrow)</option>
                    <option value="config">Global Settings (Countdown)</option>
                </select>
            </div>

            <div id="config-fields" style="display: none; background: rgba(0, 242, 254, 0.05); padding: 1.5rem; border-radius: 15px; margin-bottom: 2rem; border: 1px solid var(--primary);">
                <div class="form-group">
                    <label>Countdown Target Date & Time</label>
                    <input type="text" id="config-target-date" placeholder="February 7, 2026 09:00:00">
                    <small style="color: var(--text-dim); display: block; margin-top: 5px;">Format: Month Day, Year HH:MM:SS</small>
                </div>
                <button class="btn btn-primary" onclick="saveConfig()" style="width: 100%; font-size: 0.8rem;">Update Launch Date</button>
            </div>

            <div id="event-fields">
                <div class="form-group">
                    <label>Event Name / Title</label>
                    <input type="text" id="name" placeholder="Cricket / Registration Open">
                </div>
                <div class="form-group">
                    <label>Date / Time</label>
                    <input type="text" id="datetime" placeholder="2026-03-15 | 10:00 AM">
                </div>
                <div class="form-group">
                    <label>Venue / Content</label>
                    <textarea id="info" rows="3" placeholder="Main Ground / Register at office..."></textarea>
                </div>
                <div class="form-group">
                    <label>Image URL (Optional)</label>
                    <input type="text" id="image-url" placeholder="https://example.com/image.jpg">
                </div>
                <div class="form-group">
                    <label>Category / Result (Optional)</label>
                    <input type="text" id="meta" placeholder="Boys / Winner: CSE Dept">
                </div>
                <div class="form-group">
                    <label>Participants PDF</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="participants-pdf" placeholder="assets/pdf/event-name.pdf" style="flex: 2;">
                        <input type="file" id="pdf-file-input" accept=".pdf" style="display: none;" onchange="handleFileUpload(this)">
                        <button type="button" class="btn" style="flex: 1; font-size: 0.8rem; background: var(--primary); color: black;" onclick="document.getElementById('pdf-file-input').click()">Browse Local File</button>
                    </div>
                    <small id="upload-status" style="display: block; margin-top: 5px; color: var(--text-dim); font-size: 0.75rem;">Max 2-3MB recommended for local storage.</small>
                </div>
            </div>

            <button class="btn btn-primary" onclick="handleSave()" style="width: 100%;">Save Data</button>
            <div id="status-msg" style="margin-top: 1rem; text-align: center;"></div>
        </div>

        <div class="section-title" style="margin-top: 100px;">Manage Existing Data</div>
        <div id="admin-data-list" class="admin-form" style="padding: 1.5rem;">
            <div class="form-group">
                <label>View Category</label>
                <select id="view-type" onchange="loadAdminData()">
                    <option value="sports">Sports</option>
                    <option value="cultural">Cultural</option>
                    <option value="other-events">Other Events</option>
                    <option value="updates">News / Live Update</option>
                </select>
            </div>
            <div id="data-items-container" style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- Loaded via JS -->
            </div>
        </div>
    </div>

    <script src="js/fetchData.js"></script>
    <script src="js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadAdminData();
            
            document.getElementById('target-type').addEventListener('change', function() {
                const eventFields = document.getElementById('event-fields');
                const configFields = document.getElementById('config-fields');
                if (this.value === 'config') {
                    eventFields.style.display = 'none';
                    configFields.style.display = 'block';
                    document.getElementById('config-target-date').value = localStorage.getItem('bec_britanika_target_date') || 'February 7, 2026 09:00:00';
                } else {
                    eventFields.style.display = 'block';
                    configFields.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
