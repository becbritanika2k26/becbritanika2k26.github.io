<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINNERS WALL | BRITANIKA 2K26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=2.6">
    <link rel="stylesheet" href="css/broadcast.css?v=2.6">
    <style>
        body {
            background: #020617;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow-x: hidden;
            color: #fff;
        }

        .winners-header {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(2, 6, 23, 0.9));
            padding: 60px 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent-gold);
            position: relative;
        }

        .winners-header h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 900;
            margin: 0;
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        .winners-header p {
            opacity: 0.6;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            margin-top: 10px;
        }

        .winners-grid {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .winner-card-new {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            position: relative;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .winner-card-new:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--accent-gold);
            box-shadow: 0 20px 40px rgba(245, 158, 11, 0.15);
        }

        .winner-card-new::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        }

        .event-label {
            font-size: 0.7rem;
            font-weight: 900;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            display: block;
        }

        .winner-college {
            font-size: 0.8rem;
            opacity: 0.7;
            font-weight: 500;
        }

        .trophy-glow {
            font-size: 3rem;
            color: var(--accent-gold);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.5));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .nav-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: #fff;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 900;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        .nav-btn:hover { background: #fff; color: #000; }

        .loader {
            text-align: center;
            padding: 100px;
            opacity: 0.5;
        }

        @media (max-width: 600px) {
            .winners-grid { grid-template-columns: 1fr; }
            .winners-header { padding: 80px 20px 40px; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> HOME</a>

    <header class="winners-header">
        <div class="trophy-glow"><i class="fas fa-trophy"></i></div>
        <h1>THE <span style="color: var(--accent-gold);">WINNERS</span> WALL</h1>
        <p>Celebrating Excellence | Britanika 2K26 Hall of Fame</p>

        <div style="max-width: 800px; margin: 30px auto 0; display: flex; flex-direction: column; gap: 20px;">
            <!-- Category Filters -->
            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;" id="category-filters">
                <button class="nav-btn" style="position:static; background: var(--accent-gold); color:#000;" data-cat="all">ALL</button>
                <button class="nav-btn" style="position:static;" data-cat="Outdoor Sports">OUTDOOR</button>
                <button class="nav-btn" style="position:static;" data-cat="Indoor Events">INDOOR</button>
                <button class="nav-btn" style="position:static;" data-cat="Cultural">CULTURAL</button>
                <button class="nav-btn" style="position:static;" data-cat="Technical">TECHNICAL</button>
            </div>
            
            <!-- Search Bar -->
            <div style="position: relative; max-width: 500px; margin: 0 auto; width: 100%;">
                <i class="fas fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); opacity: 0.5;"></i>
                <input type="text" id="winner-search" placeholder="Search by event or winner name..." 
                       style="width: 100%; padding: 12px 12px 12px 45px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; color: #fff; font-family: inherit; outline: none; transition: 0.3s;">
            </div>
        </div>
    </header>

    <div class="winners-grid" id="full-winners-list">
        <div class="loader">
            <i class="fas fa-circle-notch fa-spin fa-2x"></i>
            <p>Loading Champions...</p>
        </div>
    </div>

    <script src="js/winnerRenderer.js?v=2.6"></script>
    <script type="module">
        import RealtimeSync from './js/realtimeSync.js?v=2.6';

        const container = document.getElementById('full-winners-list');
        const searchInput = document.getElementById('winner-search');
        const filterBtns = document.querySelectorAll('#category-filters button');
        
        let allWinners = [];
        let currentFilter = 'all';

        function render() {
            let filtered = allWinners;
            
            // Apply category filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(w => w.category === currentFilter);
            }

            // Apply search filter
            const term = searchInput.value.toLowerCase();
            if (term) {
                filtered = filtered.filter(w => 
                    (w.eventName && w.eventName.toLowerCase().includes(term)) || 
                    (w.winners && w.winners.first && w.winners.first.toLowerCase().includes(term)) ||
                    (w.winners && w.winners.second && w.winners.second.toLowerCase().includes(term)) ||
                    (w.winners && w.winners.third && w.winners.third.toLowerCase().includes(term))
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div class="loader" style="grid-column: 1/-1;"><p>No records found matching your criteria.</p></div>';
                return;
            }

            // Use professional renderer for correct property mapping and podium design
            container.innerHTML = filtered.map(w => window.WinnerRenderer.renderWinnerCard(w)).join('');
        }

        // Logic for filters
        filterBtns.forEach(btn => {
            btn.onclick = () => {
                filterBtns.forEach(b => {
                    b.style.background = 'rgba(255,255,255,0.1)';
                    b.style.color = '#fff';
                });
                btn.style.background = 'var(--accent-gold)';
                btn.style.color = '#000';
                currentFilter = btn.dataset.cat;
                render();
            };
        });

        searchInput.oninput = render;

        RealtimeSync.subscribeCollection('winners', (data) => {
            if (!data) return;
            allWinners = data.sort((a,b) => b.timestamp - a.timestamp);
            render();
        });
    </script>
</body>
</html>
