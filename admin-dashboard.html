<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANALYTICS DASHBOARD | BRITANIKA 2K26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/broadcast.css">

    <style>
        :root {
            --bg-dark: #020617;
            --card-bg: rgba(30, 41, 59, 0.4);
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-gold: #f59e0b;
        }

        body.admin-theme {
            background: var(--bg-dark);
            font-family: 'Outfit', sans-serif;
            color: #fff;
            margin: 0;
            overflow-x: hidden;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,0.1);
            background: rgba(30, 41, 59, 0.6);
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 100px; height: 100px;
            background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
            opacity: 0.1;
            filter: blur(20px);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(255,255,255,0.05);
        }

        .stat-info h3 {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-info .value {
            font-size: 2.2rem;
            font-weight: 900;
            margin-top: 5px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .chart-container {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .recent-visitors {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .visitor-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .visitor-item:last-child { border-bottom: none; }

        .visitor-info div { font-size: 0.9rem; font-weight: bold; }
        .visitor-info span { font-size: 0.7rem; opacity: 0.5; }
        .visitor-page {
            font-size: 0.7rem;
            padding: 4px 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 50px;
            color: var(--accent-blue);
        }

        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent-red);
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .event-viewers-list {
            margin-top: 20px;
            display: grid;
            gap: 10px;
        }

        .event-viewer-item {
            background: rgba(255,255,255,0.02);
            padding: 12px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (max-width: 1024px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: 1fr; }
            .dashboard-container { padding: 20px 10px; }
            .stat-info .value { font-size: 1.8rem; }
        }
    </style>
</head>
<body class="admin-theme">
    <div id="auth-wall" style="position: fixed; top:0; left:0; width:100%; height:100%; background: #020617; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;">
        <h2 style="color: #38bdf8;">ADMIN ACCESS REQUIRED</h2>
        <a href="admin.html" class="btn-main" style="text-decoration: none; background: #38bdf8; color: #000; padding: 12px 25px; border-radius: 8px;">GO TO LOGIN PAGE</a>
    </div>

    <header class="admin-header">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="assets/logo.png" alt="Logo" style="width: 40px;">
            <h1 style="margin: 0; font-size: 1.2rem;">BRITANIKA <span style="color: var(--primary);">LIVE ANALYTICS</span></h1>
        </div>
        <div style="display: flex; gap: 10px;">
            <a href="admin.html" class="btn-main" style="margin: 0; background: rgba(255,255,255,0.1); color: #fff; font-size: 0.7rem; padding: 8px 15px;">BACK</a>
        </div>
    </header>

    <div class="dashboard-container">
        
        <div class="stats-grid">
            <!-- Total Visitors -->
            <div class="stat-card" style="--accent-color: var(--accent-blue);">
                <div class="stat-icon" style="color: var(--accent-blue);"><i class="fas fa-users-viewfinder"></i></div>
                <div class="stat-info">
                    <h3>👥 Total Visitors</h3>
                    <div class="value" id="all-time-visitors">0</div>
                </div>
            </div>

            <!-- Today's Visitors -->
            <div class="stat-card" style="--accent-color: var(--accent-green);">
                <div class="stat-icon" style="color: var(--accent-green);"><i class="fas fa-calendar-check"></i></div>
                <div class="stat-info">
                    <h3>📅 Today's Visitors</h3>
                    <div class="value" id="today-visitors">0</div>
                </div>
            </div>

            <!-- Live Users -->
            <div class="stat-card" style="--accent-color: var(--accent-red);">
                <div class="stat-icon" style="color: var(--accent-red);"><i class="fas fa-circle-dot"></i></div>
                <div class="stat-info">
                    <h3>🔴 Live Users Now</h3>
                    <div class="value" id="live-users">0</div>
                </div>
            </div>

            <!-- Live Stream Viewers -->
            <div class="stat-card" style="--accent-color: var(--accent-gold);">
                <div class="stat-icon" style="color: var(--accent-gold);"><i class="fas fa-tv"></i></div>
                <div class="stat-info">
                    <h3>📺 Live Stream Viewers</h3>
                    <div class="value" id="live-viewers">0</div>
                </div>
            </div>
        </div>

        <div class="main-grid">
            <div class="left-col">
                <div class="chart-container" style="margin-top: 0;">
                    <h3 style="margin-bottom: 20px;"><i class="fas fa-tv" style="color: var(--accent-gold);"></i> Event-wise Live Viewers</h3>
                    <div class="event-viewers-list" id="event-viewers-list">
                        <!-- Dynamic items -->
                        <div style="text-align: center; opacity: 0.5; padding: 20px;">Calculating live broadcast data...</div>
                    </div>
                    
                    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between;">
                        <div>
                            <span style="opacity: 0.6; font-size: 0.9rem;">PEAK LIVE VIEWERS</span>
                            <div style="font-size: 1.5rem; font-weight: 900; color: var(--accent-gold);" id="peak-viewers">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-col">
                <div class="recent-visitors">
                    <h3 style="margin: 0 0 20px 0;">Recent Visitors</h3>
                    <div id="recent-visitors-list">
                        <!-- Dynamic items -->
                        <div class="loading-shimmer" style="height: 50px; margin-bottom: 10px;"></div>
                        <div class="loading-shimmer" style="height: 50px; margin-bottom: 10px;"></div>
                        <div class="loading-shimmer" style="height: 50px;"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="js/adminDashboard.js"></script>
</body>
</html>
